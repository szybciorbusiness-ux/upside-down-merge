:root{
  color-scheme:dark;
  --u:1px;
  --bg:#0c0c0f;
  --screen:#1e1e2a;
  --field:#353543;
  --ink:#f4f1ea;
  --brand:#a6a6bc;
  --muted:#8b8b96;
  --danger:#ff4d5e;
  --panel:#17171c;
  --font-display:"HorizonTal","Arial Black",Impact,sans-serif;
  --font-brand:var(--font-display);
  --font-system:-apple-system,"SF Pro Text","SF Pro",system-ui,"Segoe UI",Roboto,sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-display);overflow:hidden;display:grid;place-items:center;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#phone{position:relative;width:calc(450*var(--u));height:calc(920*var(--u))}
#bezel{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
#screen{position:absolute;left:calc(24*var(--u));top:calc(23*var(--u));width:calc(402*var(--u));height:calc(874*var(--u));
  background:#000;border-radius:calc(63*var(--u));overflow:hidden;will-change:transform}
/* everything but the settings sheet. While the sheet is up it sits back: a little smaller, rounded, dropped from the top */
#back{position:absolute;inset:0;overflow:hidden;background:var(--screen);transform-origin:50% 0;
  transition:transform .5s cubic-bezier(.32,.72,0,1),border-radius .5s cubic-bezier(.32,.72,0,1)}
#back.pushed{transform:translateY(calc(54*var(--u))) scale(var(--push-s,.849));border-radius:calc(22*var(--u))}
body.bare #back.pushed{transform:translateY(calc(30*var(--u) + env(safe-area-inset-top,0px))) scale(var(--push-s,.849))}
#back.drag{transition:none}
#tint{position:absolute;inset:0;pointer-events:none;opacity:0;will-change:opacity}
body.bare{background:var(--screen)}   /* the shake slides the screen a few px; the edge it uncovers is the same colour */
body.bare #phone{width:100vw;height:100dvh}
body.cg #phone{width:min(100vw,62dvh)}   /* a portrait column in a landscape frame; the sides are the screen's own colour */
body.cg .doc p{font-size:max(13px,calc(15*var(--u)));color:rgba(255,255,255,.8)}
body.cg #sheet .row{font-size:max(15px,calc(24*var(--u)))}
body.cg .doc h3{font-size:max(16px,calc(24*var(--u)))}
body.adbusy #screen{pointer-events:none}   /* an ad is being asked for or shown: nothing in the game can be pressed */
#revive-note{margin:0;font:900 calc(15*var(--u))/1.2 var(--font-display);color:rgba(255,255,255,.7);text-align:center}
#revive-yes:disabled{opacity:.4;animation:none;cursor:default}
body.cg #mark{display:none!important}
body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
#revive-no.cgno{padding:calc(20*var(--u)) calc(70*var(--u));border:0;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;font:900 calc(26*var(--u)) var(--font-display);cursor:pointer}
#revive-yes .ad{display:inline-block;width:calc(26*var(--u));height:calc(26*var(--u));margin-right:calc(10*var(--u));vertical-align:-0.18em}
body.bare #bezel,body.bare #status{display:none}
body.bare #screen{left:0;top:0;width:100%;height:100%;border-radius:0;padding-top:env(safe-area-inset-top,0px)}
#status{position:absolute;z-index:5;pointer-events:none;left:0;right:0;top:0;height:calc(62*var(--u));display:flex;align-items:center;gap:calc(154*var(--u));
  padding:calc(2*var(--u)) calc(24*var(--u)) 0;color:#fff;font:590 calc(17*var(--u))/1 var(--font-system);font-variant-numeric:tabular-nums}
#status>div{flex:1 0 0;display:flex;align-items:center;justify-content:center;gap:calc(7*var(--u));min-width:0}
#status span{display:block;flex:none}
#status svg{display:block;width:100%;height:auto}
#status .cell{width:calc(19.2*var(--u))}#status .wifi{width:calc(17.142*var(--u))}#status .batt{width:calc(27.328*var(--u))}
#hud{position:absolute;left:0;right:0;top:calc(62*var(--u));height:calc(68*var(--u))}
body.bare #hud{top:calc(10*var(--u) + env(safe-area-inset-top,0px))}
#brand{position:absolute;left:calc(20*var(--u));top:calc(6*var(--u));margin:0;font:900 calc(36*var(--u))/normal var(--font-brand);color:#505062;letter-spacing:0;
  font-variant-numeric:tabular-nums;white-space:nowrap;transform-origin:0 60%;will-change:transform}
#gear{position:absolute;left:calc(348*var(--u));top:calc(13*var(--u));width:calc(36*var(--u));height:calc(36*var(--u));padding:0;border:0;border-radius:50%;
  background:transparent;cursor:pointer;display:grid;place-items:center;transition:transform .15s ease;color:var(--gear-c,#484859);will-change:transform}
#gear svg{width:100%;height:100%}
#gear:active{transform:scale(.92)}
#gear:focus-visible,#sheet button:focus-visible,#again:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* settings: a bottom sheet over a dimmed screen. It rises on the sheet curve, follows a downward drag, and leaves by
   a drag, a tap on the dimmed screen, or Escape. More swaps it for a second sheet of the same build. The game runs in slow motion behind it. */
#scrim{position:absolute;inset:0;z-index:3;background:rgba(0,0,0,.4);opacity:0;transition:opacity .35s ease}
#scrim.open{opacity:1}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:4;
  padding:calc(32*var(--u)) calc(32*var(--u)) calc(31*var(--u) + env(safe-area-inset-bottom,0px));
  border-radius:calc(54*var(--u)) calc(54*var(--u)) 0 0;background:var(--sh,#353543);color:var(--ink);
  transform:translateY(110%);transition:transform .5s cubic-bezier(.32,.72,0,1);will-change:transform;touch-action:none}
#sheet.open{transform:translateY(0)}
#sheet.fast{transition-duration:.24s}   /* between its two sets of rows the sheet moves quickly (user: "way faster") */
#sheet.open.swap{transform:translateY(110%);transition:transform .12s cubic-bezier(.4,0,1,1)}   /* on its way down to come back as the other sheet */
#sheet.drag,#scrim.drag{transition:none}
#scrim:not(.open),#sheet:not(.open){pointer-events:none}   /* on its way out it takes no presses: the game is already running */
#sheet:focus{outline:none}
#sheet::after{content:"";position:absolute;left:0;right:0;top:100%;height:calc(80*var(--u));background:inherit}   /* nothing shows under it when it is pulled up */
#sheet [hidden]{display:none}
.grab{position:absolute;left:50%;top:calc(10*var(--u));width:calc(53*var(--u));height:calc(6*var(--u));margin-left:calc(-26.5*var(--u));border-radius:999px;background:var(--sh-row,rgba(30,30,42,.6))}
.view{display:flex;flex-direction:column;gap:calc(6*var(--u))}
