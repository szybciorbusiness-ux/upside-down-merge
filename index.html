<title>Upside Down Merge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one full-bleed canvas column (9:16 world), a quiet score band above the container,
   two corner controls, and a single overlay for game over. Single dark look by choice. */
:root{
  color-scheme:dark;
  --bg:#0c0c0f;
  --field:#050507;
  --wall:#3b3b44;
  --ink:#f4f1ea;
  --muted:#8b8b96;
  --danger:#ff4d5e;
  --panel:#17171c;
  --font-display:"Fredoka",ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-display);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;height:100%;overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:none}
.ctl{position:absolute;display:grid;place-items:center;width:40px;height:40px;padding:0;border:0;border-radius:50%;
  background:transparent;color:var(--muted);cursor:pointer;transition:color .15s ease,transform .12s ease}
.ctl:hover{color:var(--ink)}
.ctl:active{transform:scale(.92)}
.ctl:focus-visible,#again:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ctl svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,5,7,.72);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  animation:fade .28s ease both}
.panel{display:flex;flex-direction:column;align-items:center;gap:18px;min-width:min(260px,100%);
  padding:28px 32px;border-radius:22px;background:var(--panel);animation:rise .32s cubic-bezier(.2,.9,.3,1.2) both}
.panel h1{margin:0;font-size:30px;font-weight:700;letter-spacing:.06em}
.panel dl{display:flex;gap:28px;margin:0}
.panel dl div{display:flex;flex-direction:column;align-items:center;gap:2px}
.panel dt{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.panel dd{margin:0;font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
#again{padding:12px 34px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);
  font:600 18px var(--font-display);cursor:pointer;transition:transform .12s ease}
#again:active{transform:scale(.95)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.96)}}
@media (prefers-reduced-motion:reduce){#over,.panel{animation:none}}
</style>

<div id="stage">
  <canvas id="c" aria-label="Upside Down Merge play field"></canvas>
  <button class="ctl" id="restart" type="button" aria-label="Restart">
    <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v5h5"/></svg>
  </button>
  <button class="ctl" id="sound" type="button" aria-label="Mute sound" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path id="snd-on" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.6 7.6 0 0 1 0 11"/><path id="snd-off" d="M16 9.5l5 5M21 9.5l-5 5" hidden/></svg>
  </button>
  <div id="over" hidden>
    <div class="panel" role="dialog" aria-labelledby="over-title">
      <h1 id="over-title">GAME OVER</h1>
      <dl>
        <div><dt>Score</dt><dd id="o-score">0</dd></div>
        <div><dt>Best</dt><dd id="o-best">0</dd></div>
      </dl>
      <button id="again" type="button">Restart</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ───────────────────────── world + tuning ───────────────────────── */
const W = 360;                 // world width (units). Height adapts to the screen.
let H = 640;
const WALL_L = 14, WALL_R = W - 14, CEIL = 76, CHAMFER = 26;
const LX = W / 2;
let TRAY_Y = 574, DANGER_Y = 474, FLOOR_Y = 614;
const TRAY_MAX = 3, TRAY_R = 34, GATE_TIME = 0.75;   // shelf of 3 shapes, fed from a gate on each side
const PULL_MIN = 14, PULL_FULL = 120, PULL_DRAW = 26, POW_MIN = 0.3, POW_MAX = 1.12; // slingshot: pull back, it flies the other way
const TRAJ_DOTS = 7;           // aim preview: a few dots past the arrow, no landing marker

const G = 760;                 // gravity, pulling UP (-y); gentle, so shapes drift up rather than slam
const SHOT = 820;              // launch speed
const DT = 1 / 240;            // physics substep
const MARGIN = 1.3;            // contact skin → the thin dark seam between blobs
const PEN_MAX = 7;
const WALL_W = 0.12;           // how light a wall-held point counts in a blob-to-blob contact
const CONTACT_PASSES = 2;      // contact solves per substep; one pass lets squeezed blobs sink into each other
const MU = 0.38, MU_WALL = 0.22;
const K0 = 0.011, K1 = 1.5, KMAX = 0.6;   // shape stiffness: very soft (jelly), stiffening hard only near collapse
const STRAIN = 0.85;           // how far a point may leave its rest place, in radii
const KB = 0.06;               // outline smoothness: local bending, so it wobbles in big lazy lumps, not wrinkles
const KA = 0.6;                // area (pressure) stiffness
const KD = 0.008;              // deformation damping: about four visible wobbles, then rest
const LIN_DAMP = 0.9993, ANG_DAMP = 0.9995;   // in free flight
const LIN_TOUCH = 0.998, ANG_TOUCH = 0.99;    // while touching something, so piles stop rocking
const V_SLEEP2 = 2.2 * 2.2;    // rest threshold (acts like static friction)
const MERGE_TIME = 0, CHAIN_DELAY = 0.26, MERGE_PULL = 0.045;
const V_MAX = 1500;
const MAX_AIM = 1.16;          // ±66° from straight up
const DANGER_HOLD = 1.6;
const MAXN = 52;
// Skin: a damped wave that runs round each outline after a knock. Drawn only, never collided with.
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const SKIN = !REDUCED;
const SK_K = 150, SK_C = 160, SK_D = 3, SK_D2 = 0.4, SK_J = 8, SK_GC = 0.6, SK_MAX = 0.2, SK_SIG = 0.35, SK_DV0 = 60, SK_DV1 = 700;
const MUSIC = true;

const PALETTE = [
  '#ff6fa8', // 2 pink
  '#ffd23f', // 4 yellow
  '#4fe3b1', // 8 mint
  '#3f8cff', // 16 blue
  '#9b5cff', // 32 purple
  '#ff8a2b', // 64 orange
  '#f2364a', // 128 red
  '#a8e625', // 256 lime
  '#25d8f0', // 512 cyan
  '#f03fd0', // 1024 magenta
  '#f5b400', // 2048 gold
  '#f4f1ea', // 4096
  '#7c8cff', // 8192
  '#ff9c7a'  // 16384
];
const COLORS = PALETTE.map(hex => {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return { hex, r, g, b, ink: `rgb(${Math.round(r * 0.3)},${Math.round(g * 0.3)},${Math.round(b * 0.3)})` };
});
const colorFor = level => COLORS[(level - 1) % COLORS.length];
const radiusFor = level => Math.min(96, 15 + 4.6 * level + 0.18 * level * level);

/* ───────────────────────── state ───────────────────────── */
const blobs = [];
let planes = [];
let sel = null, hover = null, armed = false;   // shelf blob being aimed / hovered
let aiming = false, aim = 0, aimPtr = -1, ptrX = LX, ptrY = 0, ptrMouse = false, ptrIn = false;
let pressX = 0, pressY = 0, power = 1, selX = LX, pullX = 0, pullY = 0;
const gateT = [0, 0], gateFlash = [0, 0]; let openQ = [];
let score = 0, shown = 0, best = 0, combo = 0, comboIdle = 0;
let over = false, overT = 0, dangerT = 0, warn = false;
let hintA = 1, firstShot = false;
let time = 0, acc = 0, shake = 0, shakeT = 0;
let muted = false;
const banner = { t: 9, x: 0, y: 0, n: 0 };
const popups = [];
for (let i = 0; i < 14; i++) popups.push({ t: 9, x: 0, y: 0, v: 0 });
let popI = 0;
const traj = new Float32Array(2 * 48); let trajN = 0, trajEndX = 0, trajEndY = 0, trajHit = false;
const tmpX = new Float32Array(MAXN), tmpY = new Float32Array(MAXN);
const drawOrder = [];

try { best = +localStorage.getItem('udm_best') || 0; muted = localStorage.getItem('udm_muted') === '1'; } catch (e) {}

/* ───────────────────────── blobs ───────────────────────── */
function makeBlob(level) {
  const r = radiusFor(level);
  const n = Math.max(14, Math.min(MAXN, Math.round(2 * Math.PI * r / 7.5)));
  const b = {
    level, value: Math.pow(2, level), r, n,
    x: new Float32Array(n), y: new Float32Array(n), px: new Float32Array(n), py: new Float32Array(n),
    vx: new Float32Array(n), vy: new Float32Array(n), qx: new Float32Array(n), qy: new Float32Array(n),
    ox: new Float32Array(n), oy: new Float32Array(n), el: new Float32Array(n), sqq: 1,
    v11: 1, v12: 0, v21: 0, v22: 1,          // current stretch of the body (world axes), drives the label
    cx: 0, cy: 0, cs: 1, sn: 0, br: r * 1.2, maxY: 0,
    scale: 1, scaleV: 0, scaleT: 1, anim: false, animT: 0,
    tray: false, sq: 0, sqV: 0, sqT: 0,     // sq: how flattened it sits on the shelf
    w: n / (r * r), area0: Math.PI * r * r,
    touched: false, sinceTouch: 0, flash: 0,
    state: 0, partner: null, mergeT: 0, noMerge: 0,
    vcx: 0, vcy: 0, pvx: 0, pvy: 0, dead: false, la: 0, pa: 0,
    label: String(Math.pow(2, level)), fs: 0
  };
  const digits = b.label.length;
  b.fs = Math.min(r * 0.84, r * 1.9 / digits);
  // irregular pebble outline
  const a2 = 0.045 + Math.random() * 0.05, a3 = 0.025 + Math.random() * 0.035, a4 = 0.01 + Math.random() * 0.02;
  const p2 = Math.random() * 6.283, p3 = Math.random() * 6.283, p4 = Math.random() * 6.283;
  let mx = 0, my = 0;
  for (let i = 0; i < n; i++) {
    const th = i / n * Math.PI * 2;
    const rr = 1 + a2 * Math.cos(2 * th + p2) + a3 * Math.cos(3 * th + p3) + a4 * Math.cos(4 * th + p4);
    b.qx[i] = Math.cos(th) * rr; b.qy[i] = Math.sin(th) * rr; mx += b.qx[i]; my += b.qy[i];
  }
  mx /= n; my /= n;
  let A = 0;
  for (let i = 0; i < n; i++) { b.qx[i] -= mx; b.qy[i] -= my; }
  for (let i = 0; i < n; i++) { const j = i + 1 < n ? i + 1 : 0; A += b.qx[i] * b.qy[j] - b.qx[j] * b.qy[i]; }
  const k = Math.sqrt(b.area0 / (A * 0.5));
  for (let i = 0; i < n; i++) { b.qx[i] *= k; b.qy[i] *= k; }
  let sq = 0;
  for (let i = 0; i < n; i++) {
    const i0 = i === 0 ? n - 1 : i - 1, i1 = i + 1 < n ? i + 1 : 0;
    b.ox[i] = b.qx[i] - (b.qx[i0] + b.qx[i1]) / 2; b.oy[i] = b.qy[i] - (b.qy[i0] + b.qy[i1]) / 2;
    b.el[i] = Math.hypot(b.qx[i1] - b.qx[i], b.qy[i1] - b.qy[i]);
    sq += b.qx[i] * b.qx[i] + b.qy[i] * b.qy[i];
  }
  b.sqq = sq / 2;
  // skin wave state, in angular units so every size ripples alike
  const g = n / 6.2832, sb = Math.sqrt(19.8 / r);
  b.h = new Float32Array(n); b.hv = new Float32Array(n); b.rp = new Float32Array(n); b.rl = new Float32Array(n);
  b.RX = new Float32Array(n); b.RY = new Float32Array(n); b.ct = new Uint8Array(n); b.cth = new Uint8Array(n); b.wl = new Uint8Array(n);
  for (let i = 0; i < n; i++) b.rl[i] = Math.hypot(b.qx[i], b.qy[i]) || 1;
  b.kS = SK_K * sb * sb; b.cS = SK_C * sb * sb * g * g; b.dS = SK_D * sb; b.d2S = SK_D2 * g * g * sb; b.sigI = SK_SIG * g;
  b.fresh = true; b.hit = false; b.flashDur = 1;
  return b;
}

// Place a blob's particles: rest shape rotated by `ang`, scaled, then stretched (sa along `dir`, sb across).
function placeBlob(b, x, y, ang, scale, dir, sa, sb, vx, vy) {
  const c = Math.cos(ang), s = Math.sin(ang), dc = Math.cos(dir), ds = Math.sin(dir);
  for (let i = 0; i < b.n; i++) {
    const lx = scale * (c * b.qx[i] - s * b.qy[i]), ly = scale * (s * b.qx[i] + c * b.qy[i]);
    const al = (lx * dc + ly * ds) * sa, ac = (-lx * ds + ly * dc) * sb;
    b.x[i] = b.px[i] = x + al * dc - ac * ds;
    b.y[i] = b.py[i] = y + al * ds + ac * dc;
    b.vx[i] = vx; b.vy[i] = vy;
  }
  b.cx = x; b.cy = y; b.cs = c; b.sn = s; b.vcx = b.pvx = vx; b.vcy = b.pvy = vy; b.pa = ang; b.la = 0;
  b.maxY = y + b.r * scale; b.br = b.r * scale * 1.25;
}

/* ───────────────────────── physics ───────────────────────── */
function solveShape(b) {
  const n = b.n, x = b.x, y = b.y, qx = b.qx, qy = b.qy;
  let cx = 0, cy = 0;
  for (let i = 0; i < n; i++) { cx += x[i]; cy += y[i]; }
  cx /= n; cy /= n;
  let a11 = 0, a12 = 0, a21 = 0, a22 = 0;
  for (let i = 0; i < n; i++) {
    const dx = x[i] - cx, dy = y[i] - cy;
    a11 += dx * qx[i]; a12 += dx * qy[i]; a21 += dy * qx[i]; a22 += dy * qy[i];
  }
  let c = a11 + a22, s = a21 - a12;
  const len = Math.hypot(s, c) || 1; c /= len; s /= len;
  b.cx = cx; b.cy = cy; b.cs = c; b.sn = s;
  const iq = 1 / b.sqq;      // stretch = A * R^T, in world axes
  b.v11 = (a11 * c - a12 * s) * iq; b.v12 = (a11 * s + a12 * c) * iq; b.v21 = (a21 * c - a22 * s) * iq; b.v22 = (a21 * s + a22 * c) * iq;

  const sc = b.scale, rr = b.r * sc, inv2 = 1 / (rr * rr), lim = STRAIN * rr, lim2 = lim * lim;
  const sxm = sc * (1 + 0.18 * b.sq), sym = sc * (1 - 0.24 * b.sq);
  for (let i = 0; i < n; i++) {
    const gx = cx + sxm * (c * qx[i] - s * qy[i]), gy = cy + sym * (s * qx[i] + c * qy[i]);
    let dx = gx - x[i], dy = gy - y[i];
    const d2 = dx * dx + dy * dy;
    let k = K0 + K1 * d2 * inv2; if (k > KMAX) k = KMAX;
    x[i] += dx * k; y[i] += dy * k;
    dx = x[i] - gx; dy = y[i] - gy;
    const e2 = dx * dx + dy * dy;
    if (e2 > lim2) { const f = lim / Math.sqrt(e2); x[i] = gx + dx * f; y[i] = gy + dy * f; }
  }
  // local bending: each point wants its rest offset from the midpoint of its neighbours
  const ox = b.ox, oy = b.oy, el = b.el;
  for (let i = 0; i < n; i++) {
    const i0 = i === 0 ? n - 1 : i - 1, i1 = i + 1 < n ? i + 1 : 0;
    const dx = (x[i0] + x[i1]) * 0.5 + sxm * (c * ox[i] - s * oy[i]) - x[i];
    const dy = (y[i0] + y[i1]) * 0.5 + sym * (s * ox[i] + c * oy[i]) - y[i];
    x[i] += KB * 0.5 * dx; y[i] += KB * 0.5 * dy;
    x[i0] -= KB * 0.25 * dx; y[i0] -= KB * 0.25 * dy; x[i1] -= KB * 0.25 * dx; y[i1] -= KB * 0.25 * dy;
  }
  // keep the outline from bunching up or tearing when it is flattened hard
  for (let i = 0; i < n; i++) {
    const j = i + 1 < n ? i + 1 : 0, ex = x[j] - x[i], ey = y[j] - y[i], l = Math.sqrt(ex * ex + ey * ey) || 1e-6, rest = el[i] * sc;
    let want = l; if (l < 0.45 * rest) want = 0.45 * rest; else if (l > 2.3 * rest) want = 2.3 * rest;
    if (want !== l) { const f = (want - l) / l * 0.5; x[i] -= ex * f; y[i] -= ey * f; x[j] += ex * f; y[j] += ey * f; }
  }
  // pressure: keep the area, so a squeeze bulges out sideways
  let A = 0, per = 0;
  for (let i = 0; i < n; i++) {
    const i0 = i === 0 ? n - 1 : i - 1, i1 = i + 1 < n ? i + 1 : 0;
    A += x[i] * y[i1] - x[i1] * y[i];
    const tx = x[i1] - x[i0], ty = y[i1] - y[i0], l = Math.sqrt(tx * tx + ty * ty) || 1;
    tmpX[i] = ty / l; tmpY[i] = -tx / l; per += l * 0.5;
  }
  let d = KA * (b.area0 * sxm * sym - A * 0.5) / per;
  if (d > 1.2) d = 1.2; else if (d < -1.2) d = -1.2;
  let br2 = 0, maxY = -1e9;
  for (let i = 0; i < n; i++) {
    x[i] += tmpX[i] * d; y[i] += tmpY[i] * d;
    const dx = x[i] - cx, dy = y[i] - cy, r2 = dx * dx + dy * dy;
    if (r2 > br2) br2 = r2;
    if (y[i] > maxY) maxY = y[i];
  }
  b.br = Math.sqrt(br2) + 1; b.maxY = maxY;
}

// Push A's particles out of B's outline (and B's edge the other way), with friction.
function collide(A, B) {
  const ax = A.x, ay = A.y, apx = A.px, apy = A.py, bx = B.x, by = B.y, bpx = B.px, bpy = B.py;
  const nA = A.n, nB = B.n, wA = A.w, wB = B.w;
  const R = B.br + MARGIN, R2 = R * R, bcx = B.cx, bcy = B.cy;
  let hits = 0;
  for (let i = 0; i < nA; i++) {
    const X = ax[i], Y = ay[i];
    const ddx = X - bcx, ddy = Y - bcy;
    if (ddx * ddx + ddy * ddy > R2) continue;
    let inside = false, best = 1e18, bj = 0, bt = 0, bqx = 0, bqy = 0;
    let x1 = bx[nB - 1], y1 = by[nB - 1];
    for (let j = 0; j < nB; j++) {
      const x2 = bx[j], y2 = by[j];
      if (((y1 > Y) !== (y2 > Y)) && (X < (x2 - x1) * (Y - y1) / (y2 - y1) + x1)) inside = !inside;
      const ex = x2 - x1, ey = y2 - y1, el = ex * ex + ey * ey;
      let t = el > 1e-9 ? ((X - x1) * ex + (Y - y1) * ey) / el : 0;
      if (t < 0) t = 0; else if (t > 1) t = 1;
      const qx = x1 + t * ex - X, qy = y1 + t * ey - Y, d2 = qx * qx + qy * qy;
      if (d2 < best) { best = d2; bj = j; bt = t; bqx = qx; bqy = qy; }
      x1 = x2; y1 = y2;
    }
    const d = Math.sqrt(best);
    if (!inside && d >= MARGIN) continue;
    const j1 = bj, j0 = bj === 0 ? nB - 1 : bj - 1;
    let nx, ny, pen;
    if (d > 1e-4) {
      if (inside) { nx = bqx / d; ny = bqy / d; pen = d + MARGIN; }
      else { nx = -bqx / d; ny = -bqy / d; pen = MARGIN - d; }
    } else {
      const ex = bx[j1] - bx[j0], ey = by[j1] - by[j0], el = Math.sqrt(ex * ex + ey * ey) || 1;
      nx = ey / el; ny = -ex / el; pen = MARGIN;
    }
    if (pen > PEN_MAX) pen = PEN_MAX;
    // a point held by a wall cannot give way, so it pushes back almost like the wall itself
    const wa = A.wl[i] ? wA * WALL_W : wA, wb = (B.wl[j0] || B.wl[j1]) ? wB * WALL_W : wB;
    const t = bt, u = 1 - t;
    const denom = wa + wb * (u * u + t * t), lam = pen / denom;
    const rdx = (X - apx[i]) - (u * (bx[j0] - bpx[j0]) + t * (bx[j1] - bpx[j1]));
    const rdy = (Y - apy[i]) - (u * (by[j0] - bpy[j0]) + t * (by[j1] - bpy[j1]));
    ax[i] = X + nx * lam * wa; ay[i] = Y + ny * lam * wa;
    const cb = lam * wb;
    bx[j0] -= nx * cb * u; by[j0] -= ny * cb * u; bx[j1] -= nx * cb * t; by[j1] -= ny * cb * t;
    const rn = rdx * nx + rdy * ny, tx = rdx - rn * nx, ty = rdy - rn * ny, tl = Math.sqrt(tx * tx + ty * ty);
    if (tl > 1e-6) {
      let f = MU * pen / tl; if (f > 1) f = 1; f /= denom;
      const fx = tx * f, fy = ty * f;
      ax[i] -= fx * wa; ay[i] -= fy * wa;
      bx[j0] += fx * wb * u; by[j0] += fy * wb * u; bx[j1] += fx * wb * t; by[j1] += fy * wb * t;
    }
    A.ct[i] = 1; B.ct[j0] = 1; B.ct[j1] = 1;
    hits++;
  }
  return hits;
}

function collideWalls(b) {
  const n = b.n, x = b.x, y = b.y, px = b.px, py = b.py;
  b.wl.fill(0);
  for (let p = 0; p < planes.length; p++) {
    const pl = planes[p], nx = pl[0], ny = pl[1], dd = pl[2];
    if (nx * b.cx + ny * b.cy - dd > b.br + 3) continue;
    for (let i = 0; i < n; i++) {
      const dist = nx * x[i] + ny * y[i] - dd;

    const k = banner.t / 1.1, pop = k < 0.12 ? 0.6 + 0.5 * (k / 0.12) : 1.1 - 0.1 * Math.min(1, (k - 0.12) / 0.1);
    ctx.globalAlpha = k > 0.7 ? 1 - (k - 0.7) / 0.3 : 1;
    ctx.save(); ctx.translate(banner.x, banner.y); ctx.scale(pop, pop);
    ctx.font = `700 19px ${FONT}`; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(5,5,7,0.85)'; ctx.fillStyle = '#f4f1ea';
    ctx.strokeText('COMBO x' + banner.n, 0, 0); ctx.fillText('COMBO x' + banner.n, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // pointer ball (mouse only), like the reference's cursor
  if (ptrMouse && ptrIn && !over) {
    ctx.beginPath(); ctx.arc(ptrX, ptrY, 5.5, 0, 6.283); ctx.fillStyle = '#a3a3ad'; ctx.fill();
    ctx.beginPath(); ctx.arc(ptrX, ptrY, 1.9, 0, 6.283); ctx.fillStyle = '#f4f1ea'; ctx.fill();
  }

  // score band
  ctx.fillStyle = '#f4f1ea'; ctx.font = `600 30px ${FONT}`;
  ctx.fillText(Math.round(shown).toLocaleString(), LX, 34);
  ctx.fillStyle = '#8b8b96'; ctx.font = `500 10.5px ${FONT}`;
  ctx.fillText('B E S T  ' + best.toLocaleString(), LX, 58);
}

/* ───────────────────────── input ───────────────────────── */
function setPull(dx, dy) {
  // Slingshot: drag back from where you pressed; the shot goes the opposite way, harder the further you pull.
  const len = Math.hypot(dx, dy);
  armed = len > PULL_MIN && dy > 4;
  if (!armed) { pullX = pullY = 0; return; }
  aim = Math.max(-MAX_AIM, Math.min(MAX_AIM, Math.atan2(-dx, dy)));
  const k = Math.min(1, (len - PULL_MIN) / (PULL_FULL - PULL_MIN));
  power = POW_MIN + (POW_MAX - POW_MIN) * k;
  pullX = -Math.sin(aim) * PULL_DRAW * (0.35 + 0.65 * k); pullY = Math.cos(aim) * PULL_DRAW * (0.35 + 0.65 * k);
}
function setPtr(e) {
  const rect = canvas.getBoundingClientRect();
  ptrX = (e.clientX - rect.left - OX) / S; ptrY = (e.clientY - rect.top - OY) / S;
  ptrMouse = e.pointerType === 'mouse'; ptrIn = true;
  if (aiming && sel) setPull(ptrX - pressX, ptrY - pressY);
  else if (ptrMouse) hover = pickTray(ptrX, ptrY, 10);
}
canvas.addEventListener('pointerdown', e => {
  if (over || (e.pointerType === 'mouse' && e.button !== 0)) return;
  initAudio(); aiming = false; setPtr(e);
  sel = pickTray(ptrX, ptrY, 1e9);
  if (!sel) return;
  aiming = true; armed = false; aimPtr = e.pointerId; pressX = ptrX; pressY = ptrY; selX = sel.cx; pullX = pullY = 0;
  sfxPick();
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
});
canvas.addEventListener('pointermove', e => { if (!aiming || e.pointerId === aimPtr) setPtr(e); });
canvas.addEventListener('pointerup', e => {
  if (!aiming || e.pointerId !== aimPtr) return;
  setPtr(e); aiming = false;
  if (armed && sel) fire(sel);
  sel = null; armed = false;
});
canvas.addEventListener('pointercancel', () => { aiming = false; armed = false; sel = null; });
canvas.addEventListener('pointerleave', () => { ptrIn = false; hover = null; });
canvas.addEventListener('contextmenu', e => { e.preventDefault(); aiming = false; armed = false; sel = null; });   // right-click cancels

function setMuted(m) {
  muted = m;
  soundBtn.setAttribute('aria-pressed', String(m)); soundBtn.setAttribute('aria-label', m ? 'Unmute sound' : 'Mute sound');
  document.getElementById('snd-on').toggleAttribute('hidden', m); document.getElementById('snd-off').toggleAttribute('hidden', !m);
  if (master) master.gain.value = m ? 0 : 0.6;
  try { localStorage.setItem('udm_muted', m ? '1' : '0'); } catch (e) {}
}
soundBtn.addEventListener('click', () => { initAudio(); setMuted(!muted); });
restartBtn.addEventListener('click', () => { initAudio(); reset(); });
againBtn.addEventListener('click', () => { initAudio(); reset(); });
// A touch going down is not a user gesture, and iOS may not count a drag's release: any tap or key wakes the audio.
['pointerup', 'touchend', 'click', 'keydown'].forEach(t => window.addEventListener(t, () => initAudio(), { capture: true, passive: true }));

/* ───────────────────────── boot ───────────────────────── */
let last = 0;
function step(t) {
  const dt = Math.max(0, Math.min(0.1, (t - last) / 1000 || 0)); last = t;
  tick(dt); draw();
}
function frame(t) { step(t); requestAnimationFrame(frame); }
// Some embedded views hand out animation frames only now and then. A timer steps the game when
// frames are late, so it keeps real time there instead of crawling. Paused while the page is hidden.
setInterval(() => { const now = performance.now(); if (!document.hidden && now - last > 40) step(now); }, 20);
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
resize(); setMuted(muted); reset();
if (document.fonts && document.fonts.load) document.fonts.load('700 20px Fredoka');
last = performance.now();
requestAnimationFrame(frame);

// small hook for automated play-testing
window.__udm = { blobs, tick, draw, reset,
  tray: () => blobs.filter(b => b.tray && b.state === 0),
  shoot(a, i, pw) { const t = this.tray(); if (!t.length) return false; aim = a; power = pw || 1; fire(t[(i || 0) % t.length]); return true; },
  pull(i, dx, dy) { const t = this.tray(); sel = t[(i || 0) % t.length] || null; aiming = !!sel; if (sel) { selX = sel.cx; pressX = sel.cx; pressY = sel.cy; ptrX = pressX + dx; ptrY = pressY + dy; setPull(dx, dy); } },
  audio() { initAudio(); return { actx, master, pick: sfxPick, shoot: sfxShoot, merge: sfxMerge, thump: sfxThump, over: sfxOver, music: musicTick }; },
  info: () => ({ n: blobs.filter(b => !b.tray).length, tray: blobs.filter(b => b.tray).map(b => b.value), score, combo, over, dangerT, H, TRAY_Y, DANGER_Y, armed, aim, power }) };
})();
</script>
