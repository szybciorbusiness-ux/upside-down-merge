:root{
  color-scheme:dark;
  --u:1px;
  --bg:#0c0c0f;
  --screen:#1e1e2a;
  --field:#353543;
  --ink:#f4f1ea;
  --brand:#a6a6bc;
  --muted:#8b8b96;
  --danger:#ff4d5e;
  --panel:#17171c;
  --font-display:"HorizonTal","Arial Black",Impact,sans-serif;
  --font-brand:var(--font-display);
  --font-system:-apple-system,"SF Pro Text","SF Pro",system-ui,"Segoe UI",Roboto,sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-display);overflow:hidden;display:grid;place-items:center;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#phone{position:relative;width:calc(450*var(--u));height:calc(920*var(--u))}
#bezel{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
#screen{position:absolute;left:calc(24*var(--u));top:calc(23*var(--u));width:calc(402*var(--u));height:calc(874*var(--u));
  background:var(--screen);border-radius:calc(63*var(--u));overflow:hidden}
body.bare{background:var(--screen)}   /* the shake slides the screen a few px; the edge it uncovers is the same colour */
body.bare #phone{width:100vw;height:100dvh}
body.bare #bezel,body.bare #status{display:none}
body.bare #screen{left:0;top:0;width:100%;height:100%;border-radius:0;padding-top:env(safe-area-inset-top,0px)}
#status{position:absolute;left:0;right:0;top:0;height:calc(62*var(--u));display:flex;align-items:center;gap:calc(154*var(--u));
  padding:calc(2*var(--u)) calc(24*var(--u)) 0;color:#fff;font:590 calc(17*var(--u))/1 var(--font-system);font-variant-numeric:tabular-nums}
#status>div{flex:1 0 0;display:flex;align-items:center;justify-content:center;gap:calc(7*var(--u));min-width:0}
#status span{display:block;flex:none}
#status svg{display:block;width:100%;height:auto}
#status .cell{width:calc(19.2*var(--u))}#status .wifi{width:calc(17.142*var(--u))}#status .batt{width:calc(27.328*var(--u))}
#hud{position:absolute;left:0;right:0;top:calc(62*var(--u));height:calc(68*var(--u))}
body.bare #hud{top:calc(10*var(--u) + env(safe-area-inset-top,0px))}
#brand{position:absolute;left:calc(20*var(--u));top:calc(6*var(--u));margin:0;font:900 calc(36*var(--u))/normal var(--font-brand);color:var(--hud,var(--brand));opacity:var(--hud-a,.3);mix-blend-mode:plus-lighter;letter-spacing:0;
  font-variant-numeric:tabular-nums;white-space:nowrap;transform-origin:0 60%;will-change:transform}
#gear{position:absolute;left:calc(348*var(--u));top:calc(13*var(--u));width:calc(36*var(--u));height:calc(36*var(--u));padding:0;border:0;border-radius:50%;
  background:transparent;cursor:pointer;display:grid;place-items:center;transition:transform .15s ease;color:var(--hud,var(--brand));mix-blend-mode:plus-lighter}
#gear svg{width:100%;height:100%}
#gear svg g{transition:opacity .15s ease}
#gear:hover svg g,#gear[aria-expanded="true"] svg g{opacity:.9}
#gear:active{transform:scale(.92)}
#gear:focus-visible,#menu button:focus-visible,#again:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#menu{position:absolute;right:calc(18*var(--u));top:calc(118*var(--u));z-index:3;display:flex;flex-direction:column;gap:calc(2*var(--u));min-width:calc(176*var(--u));
  padding:calc(6*var(--u));border-radius:calc(18*var(--u));background:#2a2a37;box-shadow:0 calc(12*var(--u)) calc(32*var(--u)) rgba(0,0,0,.45);animation:rise .22s cubic-bezier(.2,.9,.3,1.2) both}
body.bare #menu{top:calc(64*var(--u) + env(safe-area-inset-top,0px))}
#menu button{display:flex;align-items:center;justify-content:space-between;gap:calc(16*var(--u));width:100%;padding:calc(11*var(--u)) calc(14*var(--u));border:0;border-radius:calc(12*var(--u));
  background:transparent;color:var(--ink);font:900 calc(16*var(--u))/1.2 var(--font-display);cursor:pointer;text-align:left}
#menu button:hover{background:rgba(255,255,255,.06)}
#menu button span{color:var(--muted);font-size:calc(14*var(--u))}
#stage{position:absolute;left:0;right:0;top:calc(130*var(--u));bottom:0}
body.bare #stage{top:calc(78*var(--u) + env(safe-area-inset-top,0px))}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:none}
/* danger: a red vignette over the whole screen that beats faster the closer the pile is to losing */
#danger{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse 70% 60% at 50% 45%,rgba(255,40,60,0) 30%,rgba(255,30,50,.5) 72%,rgba(190,0,25,.92) 100%)}
#over{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:rgba(5,5,7,.72);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  animation:fade .28s ease both}
.panel{display:flex;flex-direction:column;align-items:center;gap:calc(18*var(--u));min-width:min(calc(260*var(--u)),100%);
  padding:calc(28*var(--u)) calc(32*var(--u));border-radius:calc(22*var(--u));background:var(--panel);animation:rise .32s cubic-bezier(.2,.9,.3,1.2) both}
.panel h1{margin:0;font-size:calc(30*var(--u));font-weight:900;letter-spacing:0}
.panel dl{display:flex;gap:calc(28*var(--u));margin:0}
.panel dl div{display:flex;flex-direction:column;align-items:center;gap:2px}
.panel dt{font-size:calc(12*var(--u));font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel dd{margin:0;font-size:calc(28*var(--u));font-weight:900;font-variant-numeric:tabular-nums}
#again{padding:calc(12*var(--u)) calc(34*var(--u));border:0;border-radius:999px;background:var(--ink);color:var(--bg);
  font:900 calc(18*var(--u)) var(--font-display);cursor:pointer;transition:transform .12s ease}
#again:active{transform:scale(.95)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(calc(10*var(--u))) scale(.96)}}
@media (prefers-reduced-motion:reduce){#over,.panel,#menu{animation:none}}

  if (!CW || !CH) return;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(CW * DPR); canvas.height = Math.round(CH * DPR);
  S = CW / W;

}
function tickClock() {
  if (bare) return;
  const d = new Date(); let h = d.getHours() % 12; if (h === 0) h = 12;
  clockEl.textContent = h + ':' + String(d.getMinutes()).padStart(2, '0');
}

function pathPts(x, y, n) {
  ctx.moveTo((x[n - 1] + x[0]) / 2, (y[n - 1] + y[0]) / 2);
  for (let i = 0; i < n; i++) { const j = i + 1 < n ? i + 1 : 0; ctx.quadraticCurveTo(x[i], y[i], (x[i] + x[j]) / 2, (y[i] + y[j]) / 2); }

}
function label(b, alpha) {

  if (v11 < 0.45) v11 = 0.45; else if (v11 > 1.7) v11 = 1.7;

  ctx.transform(v11 * ca + v12 * sa, v21 * ca + v22 * sa, -v11 * sa + v12 * ca, -v21 * sa + v22 * ca, 0, 0);

  ctx.globalAlpha = alpha;

// Blobs are flat: one colour, nothing else (user: no shadows, no shading, just the shape and the number).
function drawBlob(b, outline) {
  const c = colorFor(b.level);

  let fl = b.flash;                 // merge flash: a white veil over the same inside, fading away

  if (fl > 0) { ctx.fillStyle = `rgba(255,255,255,${(fl * fl).toFixed(3)})`; ctx.fill(); }
  if (outline) { ctx.beginPath(); pathPts(X, Y, b.n); ctx.strokeStyle = '#f4f1ea'; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.stroke(); }
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, CW, CH);   // the screen's purple gradient shows through around the field
  // the shake moves the whole screen (DOM transform), so the wordmark and menu rock with the field
  let shx = 0, shy = 0;
  if (shake > 0) { const k = shake * Math.exp(-shakeT * 9); shx = Math.sin(shakeT * 95) * k; shy = Math.cos(shakeT * 83) * k; }
  const st = (shake > 0 || tilt !== 0) ? `translate(${(shx * S).toFixed(2)}px,${(shy * S).toFixed(2)}px) rotate(${tilt.toFixed(3)}deg)` : '';
  if (st !== shakeCss) { shakeCss = st; screenEl.style.transform = st; }
  ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  // the panel is the play field: the ceiling is the "floor". No gate bars: shapes just arrive from the sides.
  // Its slate lights up in the merge colour from the top and carries a faint standing tint of the biggest blob.
  let top = 0; for (let i = 0; i < blobs.length; i++) if (!blobs[i].tray && blobs[i].level > top) top = blobs[i].level;
  const gc = COLORS[glow.c], tc = COLORS[cidx(Math.max(1, top))], ga = glow.a * glow.a * (2 - glow.a);
  const fg = ctx.createLinearGradient(0, CEIL, 0, H);
  fg.addColorStop(0, mixHex(...mixRgb(53, 53, 67, tc, 0.08), gc, 0.5 * ga));
  fg.addColorStop(0.55, mixHex(...mixRgb(53, 53, 67, tc, 0.05), gc, 0.2 * ga));
  fg.addColorStop(1, mixHex(...mixRgb(53, 53, 67, tc, 0.02), gc, 0.08 * ga));
  panelPath(); ctx.fillStyle = fg; ctx.fill();
  const sc = `linear-gradient(${mixHex(...mixRgb(30, 30, 42, tc, 0.06), gc, 0.32 * ga)},${mixHex(30, 30, 42, gc, 0.06 * ga)} 60%)`;
  if (sc !== fieldCss) { fieldCss = sc; screenEl.style.background = sc; }
  // the score and the gear sit on the screen in plus-lighter: they take the glow colour and brighten with it
  const hc = mixHex(166, 166, 188, gc, 0.85 * ga) + '|' + (0.3 + 0.45 * ga).toFixed(3);
  if (hc !== hudCss) { hudCss = hc; const [col, a] = hc.split('|'); screenEl.style.setProperty('--hud', col); screenEl.style.setProperty('--hud-a', a); screenEl.style.setProperty('--hud-g', (+a - 0.05).toFixed(3)); }
  ctx.save(); panelPath(); ctx.clip();

  // no drawn danger line. While the pile sits past it, the whole screen goes red: a heartbeat vignette over the
  // screen (DOM) and a red wash on the field, both growing with the time left before the game ends
  const dk = over ? 1 : Math.max(0, Math.min(1, (dangerT - DANGER_GRACE) / (DANGER_HOLD - DANGER_GRACE)));   // nothing shows during the grace
  let dangerA = 0;
  if (dk > 0) {
    const beat = Math.max(0, Math.sin(dangerPh * 6.2832)), pulse = over ? 0.7 : 0.35 + 0.65 * beat * beat;
    dangerA = dk * (0.4 + 0.6 * pulse);
    ctx.fillStyle = `rgba(255,40,60,${(0.22 * dangerA).toFixed(3)})`; ctx.fillRect(WALL_L, CEIL, WALL_R - WALL_L, H);   // (inside the panel clip)
    const g = ctx.createLinearGradient(0, DANGER_Y - 10, 0, DANGER_Y + 90);
    g.addColorStop(0, 'rgba(255,40,60,0)'); g.addColorStop(0.3, `rgba(255,40,60,${(0.3 * dangerA).toFixed(3)})`); g.addColorStop(1, 'rgba(255,40,60,0)');
    ctx.fillStyle = g; ctx.fillRect(WALL_L, DANGER_Y - 10, WALL_R - WALL_L, 100);
  }
  const dc = dangerA > 0.004 ? dangerA.toFixed(3) : '0';
  if (dc !== dangerCss) { dangerCss = dc; dangerEl.style.opacity = dc; }

  // aim: the straight trajectory below (no band, no text)
  const showAim = aiming && armed && sel && !over;

  // blobs, then their numbers on top
  drawOrder.length = 0; for (let i = 0; i < blobs.length; i++) drawOrder.push(blobs[i]);
  drawOrder.sort((p, q) => q.r - p.r);          // big first, so a small shape is never hidden under a big one
  for (let i = 0; i < drawOrder.length; i++) { const b = drawOrder[i]; drawBlob(b, b === sel || (b === hover && !aiming)); }
  for (let i = 0; i < blobs.length; i++) {

    label(b, 1);   // (the grabbed shape only gets the outline; no patch, no black number)
  }
  ctx.restore();   // end of the panel clip

  // trajectory: a straight ray from the grabbed shape to the first thing it would reach (ceiling, wall or
  // blob), drawn as evenly spaced dots with a faint ghost of the shape at the end. Pure geometry, no
  // simulation, so it follows the finger with no lag.
  if (showAim) {
    const ux = Math.sin(aim), uy = -Math.cos(aim), rs = sel.r * sel.scale;
    const sx = sel.cx, sy = sel.cy;
    let tEnd = uy < -1e-6 ? (CEIL + rs - sy) / uy : 1e9;                     // ceiling (the blob's top edge stops at y = CEIL + r)
    if (ux > 1e-6) tEnd = Math.min(tEnd, (WALL_R - rs - sx) / ux);           // walls
    else if (ux < -1e-6) tEnd = Math.min(tEnd, (WALL_L + rs - sx) / ux);
    for (let i = 0; i < blobs.length; i++) {                                 // first blob the moving circle would touch
      const b = blobs[i]; if (b.tray) continue;
      const rr = b.r * b.scale + rs, dx = b.cx - sx, dy = b.cy - sy, tc = dx * ux + dy * uy;
      if (tc <= 0) continue;
      const h2 = dx * dx + dy * dy - tc * tc; if (h2 >= rr * rr) continue;
      const t = tc - Math.sqrt(rr * rr - h2); if (t > 0 && t < tEnd) tEnd = t;
    }
    // only the first stretch of the path (user: "not the full trajectory"), a little longer for a harder pull
    const t0 = rs + 10, show = Math.min(tEnd - 4, t0 + 95 + 45 * (power - POW_MIN) / (POW_MAX - POW_MIN)), step = 13;
    ctx.fillStyle = '#f4f1ea';
    for (let t = t0; t < show; t += step) {
      const q = (t - t0) / (show - t0);
      ctx.globalAlpha = 0.95 * (1 - q * q);
      ctx.beginPath(); ctx.arc(sx + ux * t, sy + uy * t, 2.6 - 0.8 * q, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  drawJuice();

  // score popups: white for a lone merge, warm and bigger along a chain
  for (const p of popups) {
    if (p.t > 0.9) continue;
    const k = p.t / 0.9, big = p.c >= 2, q = Math.min(1, p.t / 0.22);
    ctx.globalAlpha = k < 0.05 ? k / 0.05 : 1 - Math.pow((k - 0.05) / 0.95, 2);
    const pop = 1 + 0.5 * Math.exp(-6 * q) * Math.cos(8 * q), fs = big ? Math.min(26, 16 + p.c * 2) : 16;
    ctx.save(); ctx.translate(p.x, p.y + 8 + k * 24); ctx.scale(pop, pop);

    ctx.strokeText('+' + p.v, 0, 0); ctx.fillText('+' + p.v, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // pointer ball (mouse only), like the reference's cursor
  if (ptrMouse && ptrIn && !over) {
    ctx.beginPath(); ctx.arc(ptrX, ptrY, 5.5, 0, 6.283); ctx.fillStyle = '#a3a3ad'; ctx.fill();
    ctx.beginPath(); ctx.arc(ptrX, ptrY, 1.9, 0, 6.283); ctx.fillStyle = '#f4f1ea'; ctx.fill();
  }

  // the wordmark is the score: it rolls up and bumps with a merge
  const scoreText = String(Math.round(shown));
  if (scoreText !== scoreShown) { scoreShown = scoreText; brandEl.textContent = scoreText; }
  const sb = scoreBump > 0 ? 1 + 0.12 * scoreBump * scoreBump : 1;
  if (sb !== scoreScale) { scoreScale = sb; brandEl.style.transform = sb === 1 ? '' : `scale(${sb.toFixed(3)})`; }
}

/* ───────────────────────── input ───────────────────────── */
function setPull(dx, dy) {
  // Slingshot: drag back from where you pressed; the shot goes the opposite way, harder the further you pull.
  const len = Math.hypot(dx, dy);
  armed = len > PULL_MIN && dy > 4;
  if (!armed) { pullX = pullY = 0; return; }
  aim = Math.max(-MAX_AIM, Math.min(MAX_AIM, Math.atan2(-dx, dy)));
  const k = Math.min(1, (len - PULL_MIN) / (PULL_FULL - PULL_MIN));
  power = POW_MIN + (POW_MAX - POW_MIN) * k;
  pullX = -Math.sin(aim) * PULL_DRAW * (0.35 + 0.65 * k); pullY = Math.cos(aim) * PULL_DRAW * (0.35 + 0.65 * k);
}
function setPtr(e) {
  const rect = canvas.getBoundingClientRect();
  ptrX = (e.clientX - rect.left - OX) / S; ptrY = (e.clientY - rect.top - OY) / S;
  ptrMouse = e.pointerType === 'mouse'; ptrIn = true;
  if (aiming && sel) setPull(ptrX - pressX, ptrY - pressY);
  else if (ptrMouse) hover = pickTray(ptrX, ptrY, 10);
}
canvas.addEventListener('pointerdown', e => {
  if (over || (e.pointerType === 'mouse' && e.button !== 0)) return;
  initAudio(); aiming = false; setPtr(e);
  sel = pickTray(ptrX, ptrY, 1e9);
  if (!sel) return;
  aiming = true; armed = false; aimPtr = e.pointerId; pressX = ptrX; pressY = ptrY; selX = sel.cx; pullX = pullY = 0;
  sfxPick();
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
});
canvas.addEventListener('pointermove', e => { if (!aiming || e.pointerId === aimPtr) setPtr(e); });
canvas.addEventListener('pointerup', e => {
  if (!aiming || e.pointerId !== aimPtr) return;
  setPtr(e); aiming = false;
  if (armed && sel) fire(sel);
  sel = null; armed = false;
});
canvas.addEventListener('pointercancel', () => { aiming = false; armed = false; sel = null; });
canvas.addEventListener('pointerleave', () => { ptrIn = false; hover = null; });
canvas.addEventListener('contextmenu', e => { e.preventDefault(); aiming = false; armed = false; sel = null; });   // right-click cancels

function setMuted(m) {
  muted = m;
  soundBtn.setAttribute('aria-pressed', String(!m)); soundState.textContent = m ? 'Off' : 'On';
  if (master) master.gain.value = m ? 0 : 0.6;
  try { localStorage.setItem('udm_muted', m ? '1' : '0'); } catch (e) {}
}
function showMenu(open) { menuEl.hidden = !open; gearBtn.setAttribute('aria-expanded', String(open)); }
gearBtn.addEventListener('click', () => { initAudio(); showMenu(menuEl.hidden); });
window.addEventListener('pointerdown', e => { if (!menuEl.hidden && !menuEl.contains(e.target) && !gearBtn.contains(e.target)) showMenu(false); }, true);
window.addEventListener('keydown', e => { if (e.key === 'Escape' && !menuEl.hidden) { showMenu(false); gearBtn.focus(); } });
soundBtn.addEventListener('click', () => { initAudio(); setMuted(!muted); });
restartBtn.addEventListener('click', () => { initAudio(); showMenu(false); reset(); });
againBtn.addEventListener('click', () => { initAudio(); reset(); });
// A touch going down is not a user gesture, and iOS may not count a drag's release: any tap or key wakes the audio.
['pointerup', 'touchend', 'click', 'keydown'].forEach(t => window.addEventListener(t, () => initAudio(), { capture: true, passive: true }));

/* ───────────────────────── boot ───────────────────────── */
let last = 0;
function step(t) {
  const now = Math.max(t, last);   // a frame timestamp can predate the last timer step; never rewind the clock
  const dt = Math.min(0.1, (now - last) / 1000 || 0); last = now;
  tick(dt); draw();
}
function frame(t) { step(t); requestAnimationFrame(frame); }
// Some embedded views hand out animation frames only now and then. A timer steps the game when
// frames are late, so it keeps real time there instead of crawling. Paused while the page is hidden.
setInterval(() => { const now = performance.now(); if (!document.hidden && now - last > 40) step(now); }, 20);
window.addEventListener('resize', resize);
tickClock(); setInterval(tickClock, 10000);
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
resize(); setMuted(muted); reset();
if (document.fonts && document.fonts.load) document.fonts.load('900 20px HorizonTal');
last = performance.now();
requestAnimationFrame(frame);

// small hook for automated play-testing
window.__udm = { blobs, tick, draw, reset,
  tray: () => blobs.filter(b => b.tray && b.state === 0),
  shoot(a, i, pw) { const t = this.tray(); if (!t.length) return false; aim = a; power = pw || 1; fire(t[(i || 0) % t.length]); return true; },
  pull(i, dx, dy) { const t = this.tray(); sel = t[(i || 0) % t.length] || null; aiming = !!sel; if (sel) { selX = sel.cx; pressX = sel.cx; pressY = sel.cy; ptrX = pressX + dx; ptrY = pressY + dy; setPull(dx, dy); } },
  audio() { initAudio(); return { actx, master, pick: sfxPick, shoot: sfxShoot, merge: sfxMerge, thump: sfxThump, over: sfxOver, music: musicTick }; },
  spawn(level, x, y) { const b = makeBlob(level); placeBlob(b, x, y, 0, 1, 0, 1, 1, 0, 0); blobs.push(b); return b; },
  fx: () => ({ hitStop, scoreBump, shake, tilt, tiltV, glow: glow.a, bits: bits.filter(b => b.t < b.life).length, sparks: sparks.filter(s => s.t < s.life).length, rings: rings.filter(r => r.t < r.life).length }),
  pickLevel, setPeak: v => { peak = v; }, order: () => runOrder.slice(), info: () => ({ peak, floor: spawnFloor(), n: blobs.filter(b => !b.tray).length, tray: blobs.filter(b => b.tray).map(b => b.value), score, combo, over, dangerT, H, TRAY_Y, DANGER_Y, armed, aim, power }) };
})();
</script>
