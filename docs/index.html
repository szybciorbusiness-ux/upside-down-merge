:root{
  color-scheme:dark;
  --u:1px;
  --bg:#0c0c0f;
  --screen:#1e1e2a;
  --field:#353543;
  --ink:#f4f1ea;
  --brand:#a6a6bc;
  --muted:#8b8b96;
  --danger:#ff4d5e;
  --panel:#17171c;
  --font-display:"Fredoka",ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
  --font-brand:"HorizonTal","Arial Black",Impact,sans-serif;
  --font-system:-apple-system,"SF Pro Text","SF Pro",system-ui,"Segoe UI",Roboto,sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-display);overflow:hidden;display:grid;place-items:center;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#phone{position:relative;width:calc(450*var(--u));height:calc(920*var(--u))}
#bezel{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
#screen{position:absolute;left:calc(24*var(--u));top:calc(23*var(--u));width:calc(402*var(--u));height:calc(874*var(--u));
  background:var(--screen);border-radius:calc(63*var(--u));overflow:hidden}
body.bare #phone{width:100vw;height:100dvh}
body.bare #bezel,body.bare #status{display:none}
body.bare #screen{left:0;top:0;width:100%;height:100%;border-radius:0;padding-top:env(safe-area-inset-top,0px)}
#status{position:absolute;left:0;right:0;top:0;height:calc(62*var(--u));display:flex;align-items:center;gap:calc(154*var(--u));

<script>
(() => {
'use strict';

/* ───────────────────────── world + tuning ───────────────────────── */
const W = 360;                 // world width (units). Height adapts to the screen.
let H = 640;
const WALL_L = 0, WALL_R = W, CEIL = 0;   // the panel's edges are the walls
const CORNER = 63 * 360 / 402;   // the panel's corner radius (63 design px) in world units
const LX = W / 2;
let TRAY_Y = 574, DANGER_Y = 474, FLOOR_Y = 614;
const TRAY_MAX = 3, TRAY_R = 34, GATE_TIME = 0.75;   // shelf of 3 shapes, fed from a gate on each side
const PULL_MIN = 14, PULL_FULL = 120, PULL_DRAW = 26, POW_MIN = 0.3, POW_MAX = 1.12; // slingshot: pull back, it flies the other way
const TRAJ_DOTS = 7;           // aim preview: a few dots past the arrow, no landing marker

const G = 760;                 // gravity, pulling UP (-y); gentle, so shapes drift up rather than slam
const SHOT = 820;              // launch speed
const DT = 1 / 240;            // physics substep
const MARGIN = 1.3;            // contact skin → the thin dark seam between blobs
const PEN_MAX = 10;
const NOTCH = 0.4;             // how far one point may sit inside the chord of its neighbours, in rest edge lengths
const YOUNG = 0.22, PEN_YOUNG = 1.2, V_YOUNG = 260;   // a newborn inflates against its neighbours over a few frames instead of launching them
const WALL_W = 0.12;           // how light a wall-held point counts in a blob-to-blob contact
const CONTACT_PASSES = 2;      // contact solves per substep; one pass lets squeezed blobs sink into each other
const MU = 0.38, MU_WALL = 0.22;
const K0 = 0.011, K1 = 1.5, KMAX = 0.6;   // shape stiffness: very soft (jelly), stiffening hard only near collapse
const STRAIN = 0.85;           // how far a point may leave its rest place, in radii
const KB = 0.06;               // outline smoothness: local bending, so it wobbles in big lazy lumps, not wrinkles
const KA = 0.6;                // area (pressure) stiffness
const KD = 0.008;              // deformation damping: about four visible wobbles, then rest
const LIN_DAMP = 0.9993, ANG_DAMP = 0.9995;   // in free flight
const LIN_TOUCH = 0.998, ANG_TOUCH = 0.99;    // while touching something, so piles stop rocking
const V_SLEEP2 = 2.2 * 2.2;    // rest threshold (acts like static friction)
const MERGE_TIME = 0, CHAIN_DELAY = 0.26, MERGE_PULL = 0.045;
const V_MAX = 1500;
const MAX_AIM = 1.16;          // ±66° from straight up
const DANGER_HOLD = 1.6;
const MAXN = 52;
// Skin: a damped wave that runs round each outline after a knock. Drawn only, never collided with.
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const SKIN = !REDUCED;
const SK_K = 150, SK_C = 160, SK_D = 3, SK_D2 = 0.4, SK_J = 8, SK_GC = 0.6, SK_MAX = 0.2, SK_SIG = 0.35, SK_DV0 = 60, SK_DV1 = 700;
const MUSIC = true;

const PALETTE = [
  '#ff6fa8', // 2 pink
  '#ffd23f', // 4 yellow
  '#4fe3b1', // 8 mint
  '#3f8cff', // 16 blue
  '#9b5cff', // 32 purple
  '#ff8a2b', // 64 orange
  '#f2364a', // 128 red
  '#a8e625', // 256 lime
  '#25d8f0', // 512 cyan
  '#f03fd0', // 1024 magenta
  '#f5b400', // 2048 gold
  '#f4f1ea', // 4096
  '#7c8cff', // 8192
  '#ff9c7a'  // 16384
];
const COLORS = PALETTE.map(hex => {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return { hex, r, g, b, ink: `rgb(${Math.round(r * 0.3)},${Math.round(g * 0.3)},${Math.round(b * 0.3)})` };
});
const colorFor = level => COLORS[(level - 1) % COLORS.length];
const radiusFor = level => Math.min(96, 15 + 4.6 * level + 0.18 * level * level);

/* ───────────────────────── state ───────────────────────── */
const blobs = [];
let planes = [];
let sel = null, hover = null, armed = false;   // shelf blob being aimed / hovered
let aiming = false, aim = 0, aimPtr = -1, ptrX = LX, ptrY = 0, ptrMouse = false, ptrIn = false;
let pressX = 0, pressY = 0, power = 1, selX = LX, pullX = 0, pullY = 0;
const gateT = [0, 0], gateFlash = [0, 0]; let openQ = [];
let score = 0, shown = 0, best = 0, combo = 0, comboIdle = 0;
let over = false, overT = 0, dangerT = 0, warn = false;
let hintA = 1, firstShot = false;
let time = 0, acc = 0, shake = 0, shakeT = 0;
let muted = false;
const popups = [];
for (let i = 0; i < 14; i++) popups.push({ t: 9, x: 0, y: 0, v: 0, c: 0 });
let popI = 0;
const traj = new Float32Array(2 * 48); let trajN = 0, trajEndX = 0, trajEndY = 0, trajHit = false;
const tmpX = new Float32Array(MAXN), tmpY = new Float32Array(MAXN);
const drawOrder = [];
// Merge juice, all in the new blob's colour: sparkles along the seam, a ring that bursts outward,
// confetti bits with comet trails, a screen shake, a score bump; along a chain, more of everything
// and a short hit-stop.
const TRAIL = 7;
const bits = []; for (let i = 0; i < 128; i++) bits.push({ t: 9, tt: 0, life: 1, x: 0, y: 0, vx: 0, vy: 0, r: 4, c: 0, a: 0, spin: 0, tx: new Float32Array(TRAIL), ty: new Float32Array(TRAIL) });
let bitI = 0;
const sparks = []; for (let i = 0; i < 96; i++) sparks.push({ t: 9, life: 1, x: 0, y: 0, vx: 0, vy: 0, s: 2, c: -1 });
const rings = []; for (let i = 0; i < 8; i++) rings.push({ t: 9, life: 1, x: 0, y: 0, r0: 0, r1: 0, c: 0 });
let ringI = 0;
let sparkI = 0;
let hitStop = 0, scoreBump = 0;

try { best = +localStorage.getItem('udm_best') || 0; muted = localStorage.getItem('udm_muted') === '1'; } catch (e) {}

/* ───────────────────────── blobs ───────────────────────── */
function makeBlob(level) {
  const r = radiusFor(level);
  const n = Math.max(14, Math.min(MAXN, Math.round(2 * Math.PI * r / 7.5)));
  const b = {
    level, value: Math.pow(2, level), r, n,
    x: new Float32Array(n), y: new Float32Array(n), px: new Float32Array(n), py: new Float32Array(n),
    vx: new Float32Array(n), vy: new Float32Array(n), qx: new Float32Array(n), qy: new Float32Array(n),
    ox: new Float32Array(n), oy: new Float32Array(n), el: new Float32Array(n), sqq: 1,
    v11: 1, v12: 0, v21: 0, v22: 1,          // current stretch of the body (world axes), drives the label
    cx: 0, cy: 0, cs: 1, sn: 0, br: r * 1.2, maxY: 0,
    scale: 1, scaleV: 0, scaleT: 1, anim: false, animT: 0,
    tray: false, sq: 0, sqV: 0, sqT: 0,     // sq: how flattened it sits on the shelf
    w: n / (r * r), area0: Math.PI * r * r,
    touched: false, sinceTouch: 0, flash: 0,
    state: 0, partner: null, mergeT: 0, noMerge: 0, young: 0,
    vcx: 0, vcy: 0, pvx: 0, pvy: 0, dead: false, la: 0, pa: 0,
    label: String(Math.pow(2, level)), fs: 0
  };
  const digits = b.label.length;
  b.fs = Math.min(r * 0.84, r * 1.9 / digits);
  // irregular pebble outline
  const a2 = 0.045 + Math.random() * 0.05, a3 = 0.025 + Math.random() * 0.035, a4 = 0.01 + Math.random() * 0.02;
  const p2 = Math.random() * 6.283, p3 = Math.random() * 6.283, p4 = Math.random() * 6.283;
  let mx = 0, my = 0;
  for (let i = 0; i < n; i++) {
    const th = i / n * Math.PI * 2;
    const rr = 1 + a2 * Math.cos(2 * th + p2) + a3 * Math.cos(3 * th + p3) + a4 * Math.cos(4 * th + p4);
    b.qx[i] = Math.cos(th) * rr; b.qy[i] = Math.sin(th) * rr; mx += b.qx[i]; my += b.qy[i];
  }
  mx /= n; my /= n;
  let A = 0;
  for (let i = 0; i < n; i++) { b.qx[i] -= mx; b.qy[i] -= my; }
  for (let i = 0; i < n; i++) { const j = i + 1 < n ? i + 1 : 0; A += b.qx[i] * b.qy[j] - b.qx[j] * b.qy[i]; }
  const k = Math.sqrt(b.area0 / (A * 0.5));
  for (let i = 0; i < n; i++) { b.qx[i] *= k; b.qy[i] *= k; }
  let sq = 0;
  for (let i = 0; i < n; i++) {
    const i0 = i === 0 ? n - 1 : i - 1, i1 = i + 1 < n ? i + 1 : 0;
    b.ox[i] = b.qx[i] - (b.qx[i0] + b.qx[i1]) / 2; b.oy[i] = b.qy[i] - (b.qy[i0] + b.qy[i1]) / 2;
    b.el[i] = Math.hypot(b.qx[i1] - b.qx[i], b.qy[i1] - b.qy[i]);
    sq += b.qx[i] * b.qx[i] + b.qy[i] * b.qy[i];
  }
  b.sqq = sq / 2;

    if (p.t > 0.9) continue;
    const k = p.t / 0.9, big = p.c >= 2, q = Math.min(1, p.t / 0.22);
    ctx.globalAlpha = k < 0.05 ? k / 0.05 : 1 - Math.pow((k - 0.05) / 0.95, 2);
    const pop = 1 + 0.5 * Math.exp(-6 * q) * Math.cos(8 * q), fs = big ? Math.min(26, 16 + p.c * 2) : 16;
    ctx.save(); ctx.translate(p.x, p.y + 8 + k * 24); ctx.scale(pop, pop);
    ctx.font = `${big ? 700 : 600} ${fs}px ${FONT}`; ctx.lineWidth = big ? 4 : 3; ctx.strokeStyle = 'rgba(5,5,7,0.85)'; ctx.fillStyle = '#f4f1ea';   // always white, bigger along a chain
    ctx.strokeText('+' + p.v, 0, 0); ctx.fillText('+' + p.v, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // pointer ball (mouse only), like the reference's cursor
  if (ptrMouse && ptrIn && !over) {
    ctx.beginPath(); ctx.arc(ptrX, ptrY, 5.5, 0, 6.283); ctx.fillStyle = '#a3a3ad'; ctx.fill();
    ctx.beginPath(); ctx.arc(ptrX, ptrY, 1.9, 0, 6.283); ctx.fillStyle = '#f4f1ea'; ctx.fill();
  }

  // the wordmark is the score: it rolls up and bumps with a merge
  const scoreText = String(Math.round(shown));
  if (scoreText !== scoreShown) { scoreShown = scoreText; brandEl.textContent = scoreText; }
  const sb = scoreBump > 0 ? 1 + 0.12 * scoreBump * scoreBump : 1;
  if (sb !== scoreScale) { scoreScale = sb; brandEl.style.transform = sb === 1 ? '' : `scale(${sb.toFixed(3)})`; }
}

/* ───────────────────────── input ───────────────────────── */
function setPull(dx, dy) {
  // Slingshot: drag back from where you pressed; the shot goes the opposite way, harder the further you pull.
  const len = Math.hypot(dx, dy);
  armed = len > PULL_MIN && dy > 4;
  if (!armed) { pullX = pullY = 0; return; }
  aim = Math.max(-MAX_AIM, Math.min(MAX_AIM, Math.atan2(-dx, dy)));
  const k = Math.min(1, (len - PULL_MIN) / (PULL_FULL - PULL_MIN));
  power = POW_MIN + (POW_MAX - POW_MIN) * k;
  pullX = -Math.sin(aim) * PULL_DRAW * (0.35 + 0.65 * k); pullY = Math.cos(aim) * PULL_DRAW * (0.35 + 0.65 * k);
}
function setPtr(e) {
  const rect = canvas.getBoundingClientRect();
  ptrX = (e.clientX - rect.left - OX) / S; ptrY = (e.clientY - rect.top - OY) / S;
  ptrMouse = e.pointerType === 'mouse'; ptrIn = true;
  if (aiming && sel) setPull(ptrX - pressX, ptrY - pressY);
  else if (ptrMouse) hover = pickTray(ptrX, ptrY, 10);
}
canvas.addEventListener('pointerdown', e => {
  if (over || (e.pointerType === 'mouse' && e.button !== 0)) return;
  initAudio(); aiming = false; setPtr(e);
  sel = pickTray(ptrX, ptrY, 1e9);
  if (!sel) return;
  aiming = true; armed = false; aimPtr = e.pointerId; pressX = ptrX; pressY = ptrY; selX = sel.cx; pullX = pullY = 0;
  sfxPick();
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
});
canvas.addEventListener('pointermove', e => { if (!aiming || e.pointerId === aimPtr) setPtr(e); });
canvas.addEventListener('pointerup', e => {
  if (!aiming || e.pointerId !== aimPtr) return;
  setPtr(e); aiming = false;
  if (armed && sel) fire(sel);
  sel = null; armed = false;
});
canvas.addEventListener('pointercancel', () => { aiming = false; armed = false; sel = null; });
canvas.addEventListener('pointerleave', () => { ptrIn = false; hover = null; });
canvas.addEventListener('contextmenu', e => { e.preventDefault(); aiming = false; armed = false; sel = null; });   // right-click cancels

function setMuted(m) {
  muted = m;
  soundBtn.setAttribute('aria-pressed', String(!m)); soundState.textContent = m ? 'Off' : 'On';
  if (master) master.gain.value = m ? 0 : 0.6;
  try { localStorage.setItem('udm_muted', m ? '1' : '0'); } catch (e) {}
}
function showMenu(open) { menuEl.hidden = !open; gearBtn.setAttribute('aria-expanded', String(open)); }
gearBtn.addEventListener('click', () => { initAudio(); showMenu(menuEl.hidden); });
window.addEventListener('pointerdown', e => { if (!menuEl.hidden && !menuEl.contains(e.target) && !gearBtn.contains(e.target)) showMenu(false); }, true);
window.addEventListener('keydown', e => { if (e.key === 'Escape' && !menuEl.hidden) { showMenu(false); gearBtn.focus(); } });
soundBtn.addEventListener('click', () => { initAudio(); setMuted(!muted); });
restartBtn.addEventListener('click', () => { initAudio(); showMenu(false); reset(); });
againBtn.addEventListener('click', () => { initAudio(); reset(); });
// A touch going down is not a user gesture, and iOS may not count a drag's release: any tap or key wakes the audio.
['pointerup', 'touchend', 'click', 'keydown'].forEach(t => window.addEventListener(t, () => initAudio(), { capture: true, passive: true }));

/* ───────────────────────── boot ───────────────────────── */
let last = 0;
function step(t) {
  const now = Math.max(t, last);   // a frame timestamp can predate the last timer step; never rewind the clock
  const dt = Math.min(0.1, (now - last) / 1000 || 0); last = now;
  tick(dt); draw();
}
function frame(t) { step(t); requestAnimationFrame(frame); }
// Some embedded views hand out animation frames only now and then. A timer steps the game when
// frames are late, so it keeps real time there instead of crawling. Paused while the page is hidden.
setInterval(() => { const now = performance.now(); if (!document.hidden && now - last > 40) step(now); }, 20);
window.addEventListener('resize', resize);
tickClock(); setInterval(tickClock, 10000);
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
resize(); setMuted(muted); reset();
if (document.fonts && document.fonts.load) document.fonts.load('700 20px Fredoka');
last = performance.now();
requestAnimationFrame(frame);

// small hook for automated play-testing
window.__udm = { blobs, tick, draw, reset,
  tray: () => blobs.filter(b => b.tray && b.state === 0),
  shoot(a, i, pw) { const t = this.tray(); if (!t.length) return false; aim = a; power = pw || 1; fire(t[(i || 0) % t.length]); return true; },
  pull(i, dx, dy) { const t = this.tray(); sel = t[(i || 0) % t.length] || null; aiming = !!sel; if (sel) { selX = sel.cx; pressX = sel.cx; pressY = sel.cy; ptrX = pressX + dx; ptrY = pressY + dy; setPull(dx, dy); } },
  audio() { initAudio(); return { actx, master, pick: sfxPick, shoot: sfxShoot, merge: sfxMerge, thump: sfxThump, over: sfxOver, music: musicTick }; },
  spawn(level, x, y) { const b = makeBlob(level); placeBlob(b, x, y, 0, 1, 0, 1, 1, 0, 0); blobs.push(b); return b; },
  fx: () => ({ hitStop, scoreBump, shake, bits: bits.filter(b => b.t < b.life).length, sparks: sparks.filter(s => s.t < s.life).length, rings: rings.filter(r => r.t < r.life).length }),
  info: () => ({ n: blobs.filter(b => !b.tray).length, tray: blobs.filter(b => b.tray).map(b => b.value), score, combo, over, dangerT, H, TRAY_Y, DANGER_Y, armed, aim, power }) };
})();
</script>
